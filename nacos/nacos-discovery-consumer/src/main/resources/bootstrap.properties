#官网:https://github.com/alibaba/spring-cloud-alibaba/wiki/Nacos-config
spring.application.name=nacos-consumer
spring.profiles.active=prod
#配置粒度:${spring.application.name}-${profile}.${file-extension:properties}


#建议:namespace 用来做项目之间配置隔离,active用来做环境之间隔离
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.namespace=2e3c2634-89fd-43dc-bfeb-8a874325eae2
spring.cloud.nacos.config.file-extension=properties

#一般无特殊需求 group 可以使用默认值,有需求的话 group也可以作为隔离配置项
#spring.cloud.nacos.config.group=DEFAULT_GROUP